acceptable_components: [nova, nova-compute, openstack-nova]
also_acceptable_root_causes:
  - |
    Equivalent framing at the storage layer: the refreshed attachment is never persisted, so the
    stale identifier left over from the previous hypervisor is what the following power-on presents
    to the storage service, which no longer recognises it.
