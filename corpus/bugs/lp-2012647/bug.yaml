notes: |
  Smoke-tagged. Real Launchpad bug, real fix commit; the reporter's own report happened to include
  a "[Root Cause / Proposed Fix]" section naming the exact cause, which was excluded from every
  channel and folded into ground_truth.root_cause instead (plan.md sec 3.4 first rule). Comment 1
  (marton-kiss) is triage-stage observation (which port serves the failing connection, and that
  resuming both units around the affected hook lets it complete) and became engineer_notes, with
  the review/commit links in later comments stripped. deployment_config and service_logs channels
  are not present for this bug: the LP report never included a `juju status`/bundle or ambient log
  excerpt beyond the traceback, and no channel should be synthesised where the reporter didn't
  provide one.
