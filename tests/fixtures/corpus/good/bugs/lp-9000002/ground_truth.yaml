root_cause: |
  When a server is rebuilt on a replacement hypervisor, the compute manager refreshes the block
  device mappings from the volume service but writes the refreshed attachment identifiers only into
  its in-memory copy. The persistent record keeps the identifier belonging to the dead hypervisor,
  because the save path filters out fields it considers derived. The next power-on therefore asks
  the storage service to look up an attachment that was deleted along with the old connection, and
  the lookup fails with a not-found that the manager surfaces as a generic instance failure. Only
  volume-backed servers are affected because an image-backed server has no such record to refresh.
component: nova
