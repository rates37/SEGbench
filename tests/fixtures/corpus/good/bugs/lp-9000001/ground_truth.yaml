acceptable_components: [neutron, neutron-api, ovn-metadata-agent, charm-neutron-api]
also_acceptable_root_causes:
  - |
    Equivalent framing at the charm layer: the upgrade restarts the agent, and the agent's
    reconnect handler skips the datapath cache refresh that the initial start performs, leaving
    per-network proxies misconfigured until the agent is restarted a second time.
