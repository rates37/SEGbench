root_cause: |
  The OVN metadata proxy builds its haproxy configuration from a cached datapath mapping that is
  populated once when the agent registers with the southbound database. During a charm upgrade the
  agent reconnects, and the reconnection path rebuilds the chassis registration without repopulating
  that mapping, so every subsequent proxy spawned for a network binds to an empty datapath and
  answers on the wrong unix socket path. Existing proxies keep working because their configuration
  was written before the reconnect, which is why only newly booted or newly migrated servers are
  affected.
component: neutron
