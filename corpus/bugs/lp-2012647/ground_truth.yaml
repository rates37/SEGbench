root_cause: |
  The keystone charm's config-changed-postupgrade hook (run by the openstack-upgrade action)
  calls update_all_domain_backends(), which calls domain_backend_changed() for every
  domain-backend relation (e.g. keystone-ldap). domain_backend_changed() unconditionally calls
  create_or_show_domain(), which queries the local Keystone admin API through manager.py.
  Unlike the charm's other identity-relation hooks, domain_backend_changed() had no
  is_unit_paused_set() guard around that call. When the documented paused-single-unit upgrade
  procedure pauses the keystone unit before running the openstack-upgrade action, the local
  Keystone API (served by apache2 on the admin port) is down, so the API call raises a
  ConnectionRefusedError/RuntimeError and the hook crashes, breaking the procedure whenever a
  domain-backend relation is present.
component: charm-keystone
fix:
  commit: 3b761c138a5359765fe6aad0dd4490679fbddb9f
  url: https://opendev.org/openstack/charm-keystone/commit/3b761c138a5359765fe6aad0dd4490679fbddb9f
  # files and symbols are generated by `segbench corpus derive`. Never hand-maintain them.
  files:
    - actions/actions.py
    - hooks/keystone_hooks.py
    - unit_tests/test_actions.py
    - unit_tests/test_keystone_hooks.py
  symbols:
    - KeystoneRelationTests.test_domain_backend_changed_complete_paused
    - ResumeTestCase.setUp
    - ResumeTestCase.test_domain_backend_reconciliation_runs_after_services_resumed
    - ResumeTestCase.test_reconciles_domain_backends_after_resuming
    - domain_backend_changed
    - resume
acceptable_components: [keystone, keystone-charm, charm-keystone, openstack-keystone-charm]
also_acceptable_root_causes:
  - |
    domain_backend_changed() (or create_or_show_domain()) queries Keystone's local admin API
    without checking whether the unit is paused, so any hook path that reaches it while the unit
    is paused for an upgrade fails with a connection-refused error against the (intentionally)
    down local API.
