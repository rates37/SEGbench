# segbench configuration.
#
# Copy to `segbench.toml` and edit. Every value below can also be overridden by an
# environment variable named `SEGBENCH_<SECTION>__<FIELD>`, e.g.
#   SEGBENCH_CAPS__WALL_CLOCK_S=600
#   SEGBENCH_PROVIDER__KIND=copilot
#   SEGBENCH_CONCURRENCY=8
#
# API keys are never written here. They are read from the environment variable named
# by `provider.api_key_env` and are never logged or serialised.

concurrency = 4
verbose = false

[paths]
corpus = "corpus"
results = "results"
image_cache = ".cache/images"
log_file = "results/segbench.jsonl"

[provider]
kind = "openrouter"                       # openrouter | copilot
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# The model matrix: every model under test. Claude models are deliberately absent
# (CLAUDE.md invariant 6) and must only be added by the maintainer.
[[models]]
id = "deepseek/deepseek-chat"
label = "DeepSeek V3"

[[models]]
id = "qwen/qwen-2.5-coder-32b-instruct"
label = "Qwen2.5 Coder 32B"

[judge]
model = "deepseek/deepseek-v4-flash"
prompt_version = "v1"
temperature = 0.0

[caps]
wall_clock_s = 300
max_cost_usd = 5.00
repeats = 1

# Composite score weights (plan.md §7.3). Stamped onto every grade record.
[scoring]
diagnosis_weight = 0.50
localisation_weight = 0.30
remedy_weight = 0.20
component_weight = 0.50
file_f1_weight = 0.30
symbol_weight = 0.20
unsupported_specific_penalty = 0.05
max_penalty = 0.15

# Container runtime (plan.md §9). LXD is primary; podman is a fallback with known gaps
# (no image build, no network ACLs) and is not interchangeable for real campaigns.
[runtime]
backend = "lxd"                           # lxd | podman
image_definitions = "images"
# lxd_project = "segbench"                # unset uses the lxc client's current project
cpu = 2
memory = "4GiB"
# disk = "20GiB"                          # only honoured on quota-capable storage pools
processes = 4096
ready_timeout_s = 90.0

# Egress proxy and git-mirror addressing (plan.md §5.1, §5.2). The proxy binds an ephemeral port
# per run on `bind_host`; the mirror address is reserved now so E2's allowlist is stable even
# though the mirror listener itself is phase 4.
[netpol]
bind_host = "0.0.0.0"
mirror_host = "127.0.0.1"
mirror_port = 18080

# Price table for the proxy's cost meter, keyed on model id string. A model absent here is still
# metered in tokens; its USD figure is reported as `estimated: true`. Empty by default — fill in
# a price per model you actually run, e.g.:
# [netpol.pricing."deepseek/deepseek-chat"]
# input_per_million_usd = 0.14
# output_per_million_usd = 0.28

# Corpus validation (plan.md §3.4).
[corpus]
# Fraction of ground_truth.root_cause vocabulary appearing in a channel above which the channel is
# flagged for human review. A warning, never a hard failure.
similarity_threshold = 0.5
# Regexes matched against hostname-shaped tokens in channels and attachments. A match is a hard
# scrubber failure. Empty by default: fill this in with your customers' naming conventions.
customer_host_patterns = []
# Escape hatches for values the detectors flag but which are known safe.
allow_values = []
allow_email_domains = []
allow_mac_prefixes = []
